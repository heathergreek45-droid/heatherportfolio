name: PDF & Theme Verification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright + Chromium
        run: |
          bun add -d playwright
          bunx playwright install --with-deps chromium

      - name: Build app
        run: bun run build

      - name: Start preview server
        run: |
          bunx vite preview --port 4173 --host 127.0.0.1 > preview.log 2>&1 &
          echo $! > preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              echo "Preview server up"; exit 0
            fi
            sleep 1
          done
          echo "Preview server failed to start"; cat preview.log; exit 1

      - name: Run PDF/theme verification
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/verify-pdf.mjs

      - name: Stop preview server
        if: always()
        run: kill "$(cat preview.pid)" || true

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-verification
          path: pdf-verification/
          if-no-files-found: warn
          retention-days: 14
